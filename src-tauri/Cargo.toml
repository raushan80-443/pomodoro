[package]
name = "pomodoro"
version = "0.2.0"
description = "Modern, distraction-free Pomodoro timer and screen locker with embedded analytics"
authors = ["raushan"]
license = "MIT"
edition = "2021"

[lib]
name = "pomodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
fs2 = "0.4"
